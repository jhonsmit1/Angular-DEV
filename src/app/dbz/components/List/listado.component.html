<div class="container-fluid">
  <h4>Listado</h4>
  <ul class="list-group-item" >
    <li *ngFor="let character of characterList; let i = index;
    let isFirst = first;
    let isLast = last;
    let isEven = even;"


    class="list-group-item" [ngClass]="{'list-group-item-success': isFirst,
    'list-group-item-warning': isLast,
    'list-group-item-priary': isEven
    }">
      <!-- <span class="text-primary">{{i+1}} </span> -->
      <span class="text-primary">{{i}} </span>
      <span>{{character.name }} - </span>
      <strong>Power:</strong>
      <span> ({{character.power}})</span>

      <!-- <span> Es el primero:{{isFirst}}</span>
      <span> Es el ultimo: {{isLast}}</span> -->
      <!-- <span>Es par:{{isEven}}</span> -->
       <button></button>
    </li>
  </ul>
</div>
